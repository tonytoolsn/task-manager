name: 技術債
description: 重構、補測試、清理程式碼
title: "[refactor] "
labels: ["type:refactor"]
body:
  - type: textarea
    id: current
    attributes:
      label: 現況
      description: 現在的程式碼有什麼問題
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 為什麼要改
      description: 不改的話會付出什麼代價
      placeholder: 每次新增欄位都要改三個地方,已經漏過一次
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 驗收條件
      value: |
        - [ ] 行為完全不變
        - [ ] 既有測試全數通過
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: estimate
    attributes:
      label: 估時
      options:
        - XS - 半天以內
        - S - 1 天
        - M - 2 天
        - L - 3 天以上（該拆了）
    validations:
      required: true
